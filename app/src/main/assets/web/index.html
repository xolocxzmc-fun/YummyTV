<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="referrer" content="no-referrer-when-downgrade">
<title>Yummy TV</title>
<link rel="preconnect" href="https://api.yani.tv">
<link rel="preconnect" href="https://static.yani.tv">
<link rel="preconnect" href="https://kodikplayer.com">
<link rel="dns-prefetch" href="https://alloha.yani.tv">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <nav id="side">
    <div class="logo"><span class="lg-mark"><img src="logo.svg" alt=""></span><span class="lbl">Yummy<b>TV</b></span></div>
    <div class="side-list" data-nav="col" id="side-nav">
      <div class="si f" data-act="side" data-v="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span class="lbl">Поиск</span></div>
      <div class="si f" data-act="side" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span class="lbl">Главная</span></div>
      <div class="si f" data-act="side" data-v="catalog"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="lbl">Каталог</span></div>
      <div class="si f" data-act="side" data-v="schedule"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span class="lbl">Расписание</span></div>
      <div class="si f" data-act="side" data-v="my"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span class="lbl">Моё</span></div>
      <div class="si f" data-act="side" data-v="random"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg><span class="lbl">Случайное</span></div>
      <div class="si f" data-act="side" data-v="settings"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span class="lbl">Настройки</span></div>
    </div>
  </nav>
  <main id="view"></main>
</div>

<div id="player" hidden>
  <div class="stage"></div>
  <div class="p-load"><div class="spin"></div><div class="p-hint"></div></div>
  <div class="p-buf"><div class="spin"></div></div>
  <div class="osd">
    <div class="osd-top">
      <div class="osd-title"></div>
      <div class="osd-sub"></div>
    </div>
    <div class="osd-bot">
      <div class="osd-row">
        <span class="osd-state"></span>
        <span class="osd-cur">0:00</span>
        <div class="bar"><i class="bar-buf"></i><i class="bar-fill"></i><b class="bar-knob"></b></div>
        <span class="osd-dur">0:00</span>
      </div>
      <div class="osd-keys"><span><b>OK</b> пауза</span><span><b>&larr; &rarr;</b> перемотка</span><span><b>&uarr;</b> серии и озвучка</span><span><b>Назад</b> выход</span></div>
    </div>
  </div>
  <div class="skip"></div>
  <div class="countdown" hidden></div>
  <div class="panel" hidden></div>
</div>

<div id="modal" hidden></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
